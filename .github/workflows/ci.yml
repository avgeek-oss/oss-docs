name: Validate and publish
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Validate generated output with Mintlify
        run: pnpm validate:fixture
      - name: Validate release tag and ancestry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node scripts/check-release.mjs
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-package
          if-no-files-found: error
          path: artifacts/
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          scope: "@avgeek-oss"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-package
          path: artifacts/
      - run: node scripts/check-release.mjs --candidate
      - name: Publish verified tarball
        run: node scripts/publish-package.mjs
      - name: Check registry integrity
        run: node scripts/check-release.mjs --published
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Verify fresh registry consumer
        run: pnpm test:published
