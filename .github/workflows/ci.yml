name: Validate and publish
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Validate actual Mintlify example
        run: |
          npx --yes mint@4.2.851 validate
          npx --yes mint@4.2.851 broken-links --check-anchors --check-redirects
          npx --yes mint@4.2.851 a11y
        working-directory: examples/site
      - name: Validate release tag and ancestry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node scripts/check-release.mjs
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-package
          if-no-files-found: error
          path: artifacts/
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@avgeek-oss"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-package
          path: artifacts/
      - run: node scripts/check-release.mjs --candidate
      - name: Publish verified tarball
        run: npm publish "./artifacts/avgeek-oss-docs-${GITHUB_REF_NAME#v}.tgz" --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check registry integrity
        run: node scripts/check-release.mjs --published
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
