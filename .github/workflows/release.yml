name: Cut release
# On-demand replacement for pushing a release tag by hand. It tags the
# current main commit as v<package.json version> and starts the
# CI workflow on that tag, which publishes the package
# that the main run of the same commit verified, after checking its
# integrity. A tag pushed with the workflow token does not
# trigger other workflows on its own, so the publish run is started
# explicitly; manual dispatch is one of the events that token may start.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release. Must match package.json. Defaults to package.json."
        required: false
        type: string
      dry_run:
        description: "Run every check and print the plan without tagging"
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: release-cutter
  cancel-in-progress: false
jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main. Releases are cut from the head of main only."
          exit 1
      - name: Note the mode
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "**Dry run.** Checks only; nothing is tagged or published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Release.** If every check passes, this run tags main and starts publishing." >> "$GITHUB_STEP_SUMMARY"
          fi
      # The only checkout that keeps its token in the git config (no
      # persist-credentials: false): "Create and push the tag" pushes with it.
      # The job runs from main only, so the code it runs is main's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Resolve the version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "$version" ]; then
            echo "::error::Requested $REQUESTED but package.json is $version. Merge the version bump first."
            exit 1
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json version $version is not a stable x.y.z release."
            exit 1
          fi
          GITHUB_REF_NAME="v$version" node scripts/check-release.mjs
          {
            echo "VERSION=$version"
            echo "TAG=v$version"
            echo "PACKAGE=$name"
          } >> "$GITHUB_ENV"
      - name: Check the changelog has an entry
        run: |
          escaped=$(printf '%s' "$VERSION" | sed 's/[.]/\\./g')
          if ! grep -Eq "^## ${escaped} \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${VERSION} (YYYY-MM-DD)' section. Add and date it before releasing."
            exit 1
          fi
      - name: Check the tag and version are new and newest
        run: |
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi
          # Only a 404 proves the version is absent. Any other failure, such
          # as a registry outage, must not let a tag through unchecked.
          output=$(npm view "$PACKAGE@$VERSION" version 2>&1) && code=0 || code=$?
          if [ "$code" -eq 0 ] && [ -n "$output" ]; then
            echo "::error::$PACKAGE@$VERSION is already on npm."
            exit 1
          fi
          if [ "$code" -ne 0 ] && ! printf '%s' "$output" | grep -q "E404"; then
            echo "::error::Could not check npm for $PACKAGE@$VERSION (exit $code). Nothing was tagged."
            printf '%s\n' "$output"
            exit 1
          fi
          # The publish run creates a GitHub release for the tag, and GitHub
          # marks a new release Latest. An older version must not take that
          # over from a newer one, so only the newest version is released.
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select((.draft or .prerelease) | not) | .tag_name')
          latest=$(printf '%s\n' "$releases" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -n "$latest" ] && [ "$(printf '%s\n' "$latest" "$TAG" | sort -V | tail -1)" != "$TAG" ]; then
            echo "::error::$TAG is older than the latest release $latest. Cut release only releases a version newer than every published one. Nothing was tagged."
            exit 1
          fi
      - name: Check main verification passed for this commit
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=10" \
            --jq '([.workflow_runs[] | select(.event == "push")] | sort_by(.created_at) | last) // empty | [.status, (.conclusion // "-"), .html_url] | @tsv')
          if [ -z "$run" ]; then
            echo "::error::No CI run exists for $GITHUB_SHA yet. It appears once the push to main is processed; try again in a minute."
            exit 1
          fi
          status=$(printf '%s' "$run" | cut -f1)
          conclusion=$(printf '%s' "$run" | cut -f2)
          url=$(printf '%s' "$run" | cut -f3)
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI for $GITHUB_SHA is $status ($conclusion), not success: $url. Run this again once it passes."
            exit 1
          fi
      # The publish run does not rebuild: it downloads the package artifact
      # from the main run it finds with this same query, and artifacts expire
      # after 30 days. Refuse here, before tagging, instead of failing there.
      - name: Check the verified artifact is still available
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success&per_page=5" \
            --jq '[.workflow_runs[] | select(.head_branch == "main")] | sort_by(.created_at) | last | .id // empty')
          if [ -z "$run" ]; then
            echo "::error::No successful CI push run exists on main for $GITHUB_SHA, so there is no verified artifact to publish. Nothing was tagged."
            exit 1
          fi
          expires=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?name=package" \
            --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .expires_at // empty')
          if [ -z "$expires" ]; then
            echo "::error::Run $run verified $GITHUB_SHA but its 'package' artifact has expired or was never uploaded. Re-run that run (gh run rerun $run) so it uploads it again, or merge a newer commit to main, then run this again. Nothing was tagged."
            exit 1
          fi
          echo "Run $run has the 'package' artifact until $expires."
          {
            echo "ARTIFACT_RUN=$run"
            echo "ARTIFACT_EXPIRES=$expires"
          } >> "$GITHUB_ENV"
      - name: Plan
        run: |
          {
            echo "## Release $TAG"
            echo
            echo "- Package: \`$PACKAGE@$VERSION\`"
            echo "- Commit: \`$GITHUB_SHA\` on \`main\`"
            echo "- Tag: \`$TAG\`, annotated, message \"Release $TAG\""
            echo "- Artifact: \`package\` from run $ARTIFACT_RUN, until $ARTIFACT_EXPIRES"
            echo "- Then: start the **CI** workflow on \`$TAG\`"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo
              echo "Dry run: nothing was tagged or started."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create and push the tag
        if: ${{ !inputs.dry_run }}
        run: |
          live=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          if [ "$live" != "$GITHUB_SHA" ]; then
            echo "::error::main moved to ${live:0:7} while this run checked ${GITHUB_SHA:0:7}. Nothing was tagged; run again on the new head."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
      - name: Start the publish workflow on the tag
        if: ${{ !inputs.dry_run }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh workflow run ci.yml --ref "$TAG"; then break; fi
            if [ "$attempt" = 5 ]; then
              echo "::error::Could not start the publish workflow. The tag $TAG exists; start the CI workflow on it by hand."
              exit 1
            fi
            sleep 5
          done
          sleep 10
          url=$(gh run list --workflow ci.yml --event workflow_dispatch --branch "$TAG" --limit 1 --json url --jq '.[0].url // ""')
          {
            echo
            echo "Tagged \`$TAG\`. Publish run: ${url:-not visible yet; see the Actions tab for $TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
